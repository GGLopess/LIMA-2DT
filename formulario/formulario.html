<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=], initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="./formulario.css">
</head>
<body>
    
    <!-- FORMULÁRIOS EM HTML -->
    <form> <!--Estrutura do formulário-->
        
        <fieldset>
            <legend>Informações de Contato</legend>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            <br>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

            <br>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

            <br>

            <label for="data">Data de Nascimento:</label>
            <input type="date" id="data" name="data" required>
            
        </fieldset>

        <fieldset>
            <legend>Preferências</legend>
            <p>Informe sua cor preferida:</p>
            <label class="azul"><input type="radio" name="cor">Azul</label>
            <label class="vermelho"><input type="radio" name="cor">Vermelho</label>

            <br>

            <p>Informe quais frutas você quer:</p>
            <label><input type="checkbox" name="fruta">Maçã</label>
            <label><input type="checkbox" name="fruta">Uva</label>

            <br>

            <p>Idioma:</p>
            <select name="idioma" id="idioma">
                <option value="" disabled selected>Selecione uma opção</option>
                <option value="pt">Português</option>
                <option value="en">Inglês</option>
            </select>

            <br>

            <label for="sugestoes">Sugestões:</label>
            <br>
            <textarea name="sugestoes" id="sugestoes"></textarea>

        </fieldset>

        <button type="submit">Enviar</button>
    </form>

</body>
</html>
